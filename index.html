<!DOCTYPE html>
<html lang="en" dir="ltr" data-bui-theme="default" data-bui-mode="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baset-UI Documentation</title>
    <meta name="description" content="Baset-UI documentation website.">

    <!-- Core library stylesheet (design tokens + base) -->
    <link rel="stylesheet" href="assets/css/baset-ui.css">
    <link rel="stylesheet" href="assets/css/themes/ocean.css">
    <!-- Documentation shell only (not part of the library) -->
    <link rel="stylesheet" href="documentation/assets/css/docs.css">
    <script>
        /* Prevents a flash of the wrong theme or mode. Same keys as BUI.theme (bui-theme, bui-mode). */
        (function () {
            var d = document.documentElement, t = null, m = null, r = null;
            try { t = localStorage.getItem('bui-theme'); m = localStorage.getItem('bui-mode'); r = localStorage.getItem('bui-docs-dir'); } catch (e) {}
            if (t && /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(t)) d.setAttribute('data-bui-theme', t);
            if (m !== 'light' && m !== 'dark') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            d.setAttribute('data-bui-mode', m);
            /* Documentation shell only: the saved direction of the RTL/LTR switcher. */
            if (r === 'rtl' || r === 'ltr') d.setAttribute('dir', r);
        })();
    </script>
</head>
<body>
    <a class="bui-docs-skip" href="#bui-docs-main">Skip to content</a>

    <header class="bui-docs-navbar" role="banner">
        <button class="bui-docs-navbar__toggle" type="button" id="bui-docs-sidebar-toggle"
                aria-controls="bui-docs-sidebar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="bui-docs-burger" aria-hidden="true"></span>
        </button>
        <a class="bui-docs-navbar__brand" href="./">Baset-UI</a>
        <div class="bui-docs-navbar__search">
            <input type="search" placeholder="Search (coming soon)" aria-label="Search documentation" disabled>
        </div>
        <div class="bui-docs-navbar__actions">
            <select class="bui-docs-select" id="bui-docs-theme-select" aria-label="Theme">
                <option value="default">Default</option>
                <option value="ocean">Ocean</option>
            </select>
            <button type="button" class="bui-docs-btn" id="bui-docs-dir-toggle" aria-label="Right-to-left layout" aria-pressed="false">RTL</button>
            <button type="button" class="bui-docs-btn" id="bui-docs-mode-toggle" aria-label="Dark mode" aria-pressed="false">Dark<span class="bui-docs-btn__extra"> mode</span></button>
            <a class="bui-docs-btn" href="https://github.com/AbdulbasetRS/Baset-UI" rel="noopener" target="_blank">GitHub</a>
        </div>
    </header>

    <div class="bui-docs-layout">
        <div class="bui-docs-backdrop" id="bui-docs-backdrop" hidden></div>
        <nav class="bui-docs-sidebar" id="bui-docs-sidebar" aria-label="Documentation navigation">
            <!-- Rendered from documentation/assets/js/nav.js -->
            <noscript>JavaScript is required to render the navigation.</noscript>
        </nav>

        <main class="bui-docs-main" id="bui-docs-main" tabindex="-1">
            <!-- Intentionally empty: documentation pages are added in future tasks. -->
        </main>
    </div>

    <footer class="bui-docs-footer">
        <span>&copy; 2026 Baset-UI</span>
        <span>Version <span data-docs-version>0.0.0-foundation</span></span>
        <a href="https://github.com/AbdulbasetRS/Baset-UI" rel="noopener" target="_blank">GitHub</a>
    </footer>

    <script src="assets/js/baset-ui.js"></script>
    <script src="documentation/assets/js/nav.js"></script>
    <script src="documentation/assets/js/docs.js"></script>
</body>
</html>
