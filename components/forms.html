<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form controls — Baset UI</title>
  <link rel="stylesheet" href="/assets/css/baset-ui.css">
</head>
<body>
  <main style="padding:28px;max-width:900px;margin:0 auto">
    <h1>Form controls</h1>
    <section style="margin-top:12px">
      <label>Text input</label>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <input class="bui-input" placeholder="Type here" style="padding:10px;border-radius:8px;border:1px solid var(--bui-line)" />
        <button class="bui-copy" data-copy="&lt;input class=&quot;bui-input&quot; placeholder=&quot;Type here&quot; /&gt;">Copy</button>
      </div>
    </section>
    <p style="margin-top:20px">Back to <a href="/index.html">Docs home</a></p>
  </main>
  <script src="/assets/js/baset-ui.js"></script>
</body>
</html>
