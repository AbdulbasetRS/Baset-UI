<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buttons — Baset UI</title>
  <link rel="stylesheet" href="/assets/css/baset-ui.css">
</head>
<body>
  <main style="padding:28px;max-width:900px;margin:0 auto">
    <h1>Buttons</h1>
    <p>Examples and copy buttons for button markup.</p>

    <section style="margin-top:18px">
      <h2>Primary</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="bui-btn bui-btn-primary">Primary</button>
        <button class="bui-copy" data-copy="&lt;button class=&quot;bui-btn bui-btn-primary&quot;&gt;Primary&lt;/button&gt;">Copy</button>
      </div>
    </section>

    <section style="margin-top:12px">
      <h2>Default</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="bui-btn">Default</button>
        <button class="bui-copy" data-copy="&lt;button class=&quot;bui-btn&quot;&gt;Default&lt;/button&gt;">Copy</button>
      </div>
    </section>

    <section style="margin-top:12px">
      <h2>Ghost</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="bui-btn bui-btn-ghost">Ghost</button>
        <button class="bui-copy" data-copy="&lt;button class=&quot;bui-btn bui-btn-ghost&quot;&gt;Ghost&lt;/button&gt;">Copy</button>
      </div>
    </section>

    <p style="margin-top:20px">Back to <a href="/index.html">Docs home</a></p>
  </main>
  <script src="/assets/js/baset-ui.js"></script>
</body>
</html>
