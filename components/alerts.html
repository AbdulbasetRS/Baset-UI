<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alerts — Baset UI</title>
  <link rel="stylesheet" href="/assets/css/baset-ui.css">
</head>
<body>
  <main style="padding:28px;max-width:900px;margin:0 auto">
    <h1>Alerts</h1>
    <section style="margin-top:12px">
      <div class="bui-alert" style="padding:12px;border-radius:8px;border:1px solid var(--bui-line);background:var(--bui-surface)">
        <strong>Notice:</strong> This is an alert.
        <button class="bui-dismiss" style="margin-left:12px">Dismiss</button>
      </div>
      <div style="margin-top:8px"><button class="bui-copy" data-copy="&lt;div class=&quot;bui-alert&quot;&gt;...alert markup...&lt;/div&gt;">Copy</button></div>
    </section>
    <p style="margin-top:20px">Back to <a href="/index.html">Docs home</a></p>
  </main>
  <script src="/assets/js/baset-ui.js"></script>
</body>
</html>
