<!DOCTYPE html>
<!--
    Manual test page for Select (Task 17).
    Test fixture only (not shipped as a component, nothing loads it). Shows: single, placeholder with and without an empty option,
    multiple, searchable (single and multiple), clearable, option groups, disabled select and option, the three sizes, validation states,
    a form (Submit shows FormData, Reset, required), a select inside a Dialog, a select near the bottom edge (flip), the remote mode
    against the countries fixture, and a large generated list (N options, set by the buttons).
    DECLARED FIXTURES: option texts are sample text (fruits, size names). The remote select reads documentation/assets/data/select-countries.json
    (250 countries, ISO code and English name, generated from Intl.DisplayNames). A static site has no server, so a small script in this page
    answers requests to "api/countries" by reading that file and applying page, perPage and search itself, after a delay. The delay, the
    failure switch and the empty switch below are test controls of this fixture, not options of the component.
    The large list is generated by the script ("Item 1" ... "Item N").
-->
<html lang="en" dir="ltr" data-bui-theme="default" data-bui-mode="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select manual test - Baset-UI</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../assets/css/baset-ui.css">
    <link rel="stylesheet" href="../../assets/css/extensions/baset-ui-icons.css">
    <link rel="stylesheet" href="../../assets/css/themes/ocean.css">
    <style>
        body { padding: var(--bui-space-3); }
        .t-bar, .t-row { display: flex; flex-wrap: wrap; gap: var(--bui-space-2); margin-block-end: var(--bui-space-3); align-items: center; }
        .t-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--bui-space-3); margin-block-end: var(--bui-space-4); }
        h2 { font-size: var(--bui-font-size-lg); }
        #t-log { max-block-size: 8rem; overflow: auto; padding: var(--bui-space-2); background: var(--bui-color-surface); border: 1px solid var(--bui-color-border); font-family: monospace; font-size: 0.8125rem; }
        .t-bottom { margin-block-start: 60vh; }
    </style>
</head>
<body>
    <h1>Select</h1>
    <div class="t-bar">
        <label>Theme <select id="t-theme"><option value="default">default</option><option value="ocean">ocean</option></select></label>
        <label>Mode <select id="t-mode"><option value="light">light</option><option value="dark">dark</option></select></label>
        <label>Direction <select id="t-dir"><option value="ltr">ltr</option><option value="rtl">rtl</option></select></label>
    </div>

    <h2>Basics</h2>
    <div class="t-grid">
        <div class="bui-form-group"><label class="bui-form-label" for="s-single">Single</label>
            <select id="s-single" data-bui-select name="single"><option value="a">Apple</option><option value="b" selected>Banana</option><option value="c">Cherry</option><option value="d" disabled>Date (disabled)</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-empty">Placeholder, empty option</label>
            <select id="s-empty" data-bui-select name="empty"><option value="">Choose a fruit</option><option value="a">Apple</option><option value="b">Banana</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-ph">Placeholder option, no empty option</label>
            <select id="s-ph" data-bui-select data-bui-placeholder="Pick one" name="ph"><option value="a">Apple</option><option value="b">Banana</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-multi">Multiple</label>
            <select id="s-multi" data-bui-select data-bui-placeholder="Choose fruits" multiple name="multi[]"><option value="a" selected>Apple</option><option value="b">Banana</option><option value="c" selected>Cherry</option><option value="d">Date</option><option value="e">Elderberry</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-search">Searchable</label>
            <select id="s-search" data-bui-select data-bui-searchable data-bui-placeholder="Type to search" name="search"><option value="">Type to search</option><option value="a">Apple</option><option value="b">Banana</option><option value="c">Cherry</option><option value="d">Date</option><option value="e">Elderberry</option><option value="f">Fig</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-searchmulti">Searchable multiple</label>
            <select id="s-searchmulti" data-bui-select data-bui-searchable data-bui-placeholder="Search fruits" multiple name="sm[]"><option value="a">Apple</option><option value="b">Banana</option><option value="c">Cherry</option><option value="d">Date</option><option value="e">Elderberry</option><option value="f">Fig</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-clear">Clearable</label>
            <select id="s-clear" data-bui-select data-bui-clearable data-bui-placeholder="Choose" name="clear"><option value="">Choose</option><option value="a" selected>Apple</option><option value="b">Banana</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-group">Groups</label>
            <select id="s-group" data-bui-select name="group"><option value="">Choose a size</option><optgroup label="Small"><option value="xs">Extra small</option><option value="s">Small</option></optgroup><optgroup label="Large"><option value="l">Large</option><option value="xl">Extra large</option></optgroup><optgroup label="Disabled group" disabled><option value="z">Zero</option></optgroup></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-dis">Disabled</label>
            <select id="s-dis" data-bui-select disabled><option value="a">Apple</option></select></div>
    </div>

    <h2>Sizes and validation</h2>
    <div class="t-grid">
        <div class="bui-form-group"><label class="bui-form-label" for="s-sm">Small</label><select id="s-sm" data-bui-select data-bui-size="sm"><option>Apple</option><option>Banana</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-lg">Large</label><select id="s-lg" data-bui-select data-bui-size="lg"><option>Apple</option><option>Banana</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-valid">Valid</label><select id="s-valid" class="is-valid" data-bui-select><option>Apple</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="s-invalid">Invalid</label><select id="s-invalid" class="is-invalid" aria-invalid="true" data-bui-select><option>Apple</option></select></div>
    </div>

    <h2>Form</h2>
    <form id="t-form" class="t-grid">
        <div class="bui-form-group"><label class="bui-form-label" for="f-req">Required</label>
            <select id="f-req" data-bui-select required name="req"><option value="">Choose</option><option value="a">Apple</option><option value="b">Banana</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="f-multi">Multiple (default Apple)</label>
            <select id="f-multi" data-bui-select multiple name="fm[]"><option value="a" selected>Apple</option><option value="b">Banana</option><option value="c">Cherry</option></select></div>
        <div class="t-row"><button class="bui-btn" type="submit">Submit</button><button class="bui-btn bui-btn--outline" type="reset">Reset</button></div>
    </form>
    <pre id="t-form-out" class="bui-docs-code" style="min-height:2rem">(submit to see FormData)</pre>

    <h2>Dialog</h2>
    <button class="bui-btn" type="button" data-bui-dialog-open="#t-dialog">Open dialog</button>
    <dialog id="t-dialog" class="bui-dialog" data-bui-dialog aria-labelledby="t-dialog-title">
        <div class="bui-dialog__panel">
            <div class="bui-dialog__header"><h2 class="bui-dialog__title" id="t-dialog-title">Select in a dialog</h2></div>
            <div class="bui-dialog__body">
                <label class="bui-form-label" for="d-select">Inside</label>
                <select id="d-select" data-bui-select data-bui-searchable><option>Apple</option><option>Banana</option><option>Cherry</option></select>
            </div>
            <div class="bui-dialog__footer"><button class="bui-btn" type="button" data-bui-dismiss>Close</button></div>
        </div>
    </dialog>

    <h2>Remote (countries fixture)</h2>
    <div class="t-row">
        <label>Delay (ms) <input id="r-delay" class="bui-input" type="number" value="300" min="0" step="100" style="inline-size:7rem"></label>
        <label><input id="r-fail" type="checkbox"> Fail</label>
        <label><input id="r-empty" type="checkbox"> Return empty</label>
    </div>
    <div class="t-grid">
        <div class="bui-form-group"><label class="bui-form-label" for="r-single">Remote single</label>
            <select id="r-single" data-bui-select="remote" data-bui-url="api/countries" data-bui-per-page="20" data-bui-searchable data-bui-clearable data-bui-placeholder="Search countries" name="country"><option value="EG" selected>Egypt</option></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="r-multi">Remote multiple, button</label>
            <select id="r-multi" multiple data-bui-select="remote" data-bui-url="api/countries" data-bui-per-page="10" data-bui-load-more="button" data-bui-searchable data-bui-placeholder="Search countries" name="countries[]"></select></div>
        <div class="bui-form-group"><label class="bui-form-label" for="r-plain">Remote, not searchable</label>
            <select id="r-plain" data-bui-select="remote" data-bui-url="api/countries" data-bui-per-page="15" data-bui-placeholder="Open to load"></select></div>
    </div>

    <h2>Large list</h2>
    <div class="t-row">
        <button class="bui-btn bui-btn--outline" type="button" data-n="1000">1,000</button>
        <button class="bui-btn bui-btn--outline" type="button" data-n="5000">5,000</button>
        <button class="bui-btn bui-btn--outline" type="button" data-n="10000">10,000</button>
        <span id="t-large-info"></span>
    </div>
    <div class="bui-form-group" style="max-inline-size:20rem"><label class="bui-form-label" for="s-large">Large</label>
        <select id="s-large" data-bui-select data-bui-searchable data-bui-placeholder="Search items"><option value="">Search items</option></select></div>

    <h2 class="t-bottom">Near the bottom edge (flips up)</h2>
    <div class="bui-form-group" style="max-inline-size:20rem"><label class="bui-form-label" for="s-flip">Flip</label>
        <select id="s-flip" data-bui-select><option>Apple</option><option>Banana</option><option>Cherry</option><option>Date</option><option>Elderberry</option><option>Fig</option><option>Grape</option><option>Honeydew</option></select></div>

    <h2>Event log</h2>
    <div id="t-log" aria-live="off"></div>

    <script src="../../assets/js/baset-ui.js"></script>
    <script>
        (function () {
            var root = document.documentElement;
            function bind(id, fn) { document.getElementById(id).addEventListener('change', function (e) { fn(e.target.value); }); }
            bind('t-theme', function (v) { BUI.theme.set(v); });
            bind('t-mode', function (v) { BUI.theme.setMode(v); });
            bind('t-dir', function (v) { root.setAttribute('dir', v); });

            var log = document.getElementById('t-log');
            ['change', 'open', 'close', 'search', 'beforeopen', 'beforeclose'].forEach(function (name) {
                document.addEventListener('bui:select:' + name, function (e) {
                    var line = document.createElement('div');
                    line.textContent = name + ' #' + (e.target.id || '?') + ' ' + JSON.stringify(e.detail);
                    log.insertBefore(line, log.firstChild);
                });
            });

            document.getElementById('t-form').addEventListener('submit', function (e) {
                e.preventDefault();
                var out = [];
                new FormData(e.target).forEach(function (v, k) { out.push(k + '=' + v); });
                document.getElementById('t-form-out').textContent = out.join('&') || '(empty)';
            });

            /* Fixture server: answers fetch() for "api/countries" from the static JSON file. Test fixture, not part of the library. */
            var realFetch = window.fetch.bind(window);
            window.__requests = [];
            window.fetch = function (input, init) {
                var url = new URL(typeof input === 'string' ? input : input.url, document.baseURI);
                if (!/\/api\/countries$/.test(url.pathname)) return realFetch(input, init);
                window.__requests.push(url.search);
                var signal = init && init.signal;
                return new Promise(function (resolve, reject) {
                    var delay = Number(document.getElementById('r-delay').value) || 0;
                    var timer = setTimeout(function () {
                        if (document.getElementById('r-fail').checked) { resolve(new Response('{}', { status: 500 })); return; }
                        realFetch('../../documentation/assets/data/select-countries.json').then(function (r) { return r.json(); }).then(function (all) {
                            var q = (url.searchParams.get('search') || '').toLowerCase();
                            var page = Number(url.searchParams.get('page')) || 1;
                            var per = Number(url.searchParams.get('perPage')) || 20;
                            var list = document.getElementById('r-empty').checked ? [] : all.filter(function (o) { return !q || o.label.toLowerCase().indexOf(q) > -1; });
                            resolve(new Response(JSON.stringify({ items: list.slice((page - 1) * per, page * per), total: list.length }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
                        }, reject);
                    }, delay);
                    if (signal) signal.addEventListener('abort', function () { clearTimeout(timer); reject(new DOMException('Aborted', 'AbortError')); });
                });
            };

            var big = document.getElementById('s-large');
            document.querySelectorAll('[data-n]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var n = Number(b.getAttribute('data-n'));
                    var list = [];
                    for (var i = 1; i <= n; i++) list.push({ value: String(i), label: 'Item ' + i });
                    var t = performance.now();
                    BUI.getInstance(big, 'select').setOptions(list);
                    document.getElementById('t-large-info').textContent = n + ' options set in ' + Math.round(performance.now() - t) + ' ms';
                });
            });

            BUI.init();
        })();
    </script>
</body>
</html>
